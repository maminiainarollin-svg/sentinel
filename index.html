<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel - Santé Simple</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f7f6; --white: #ffffff; --dark: #1a202c; --green: #48bb78; --orange: #ed8936; --red: #f56565; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--dark); padding-bottom: 100px; }
        
        /* Header */
        header { background: #004d40; color: white; padding: 30px 20px 60px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .container { padding: 0 15px; margin-top: -40px; }

        /* Score Principal */
        .main-card { background: white; border-radius: 25px; padding: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .aqi-circle { width: 100px; height: 100px; border-radius: 50%; border: 8px solid #edf2f7; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 35px; font-weight: 900; }

        /* Grille des gaz simplifiée */
        .gas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .gas-card { background: #f8fafc; padding: 12px; border-radius: 15px; border-bottom: 4px solid #cbd5e0; }
        .gas-name { font-size: 12px; font-weight: bold; color: #718096; display: block; }
        .gas-status { font-size: 13px; font-weight: bold; }

        /* Menu Profil */
        #profile-panel { position: fixed; top: 0; right: -100%; width: 90%; height: 100%; background: white; z-index: 1000; transition: 0.4s; padding: 20px; box-sizing: border-box; }
        #profile-panel.open { right: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 900; }

        input, select { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #e2e8f0; border-radius: 10px; }
        .btn-pay { background: #004d40; color: white; border: none; padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleProfile()"></div>

    <div id="profile-panel">
        <h2>Modifier mon profil</h2>
        <label>Mon Prénom</label>
        <input type="text" id="in-name" placeholder="Rollin">
        <label>Ma Maladie / Sensibilité</label>
        <select id="in-cond">
            <option value="Aucune">Aucune (En bonne santé)</option>
            <option value="Asthme">Asthme</option>
            <option value="Allergie">Allergies</option>
            <option value="Cardiaque">Problème Cardiaque</option>
        </select>
        <button class="btn-pay" onclick="saveProfile()">ENREGISTRER</button>
        <button onclick="toggleProfile()" style="background:none; border:none; width:100%; margin-top:10px; color:#718096;">Fermer sans enregistrer</button>
    </div>

    <header>
        <div style="display: flex; justify-content: space-between;">
            <span id="clock" style="font-weight: bold;">--:--</span>
            <span onclick="toggleProfile()" style="cursor:pointer">👤 Modifier Profil</span>
        </div>
        <h1 id="hi-name" style="margin: 15px 0 5px; font-size: 24px;">Salut !</h1>
        <p id="hi-cond" style="font-size: 12px; opacity: 0.8;">Chargement de votre profil...</p>
    </header>

    <main class="container">
        <div class="main-card">
            <div class="aqi-circle" id="circle">--</div>
            <h3 id="aqi-text" style="margin: 5px 0;">Analyse requise</h3>
            <p id="ai-simple-advice" style="font-size: 14px; color: #4a5568;">Cliquez sur le bouton bleu pour vérifier l'air autour de vous.</p>
        </div>

        <div class="gas-grid">
            <div class="gas-card" id="card-pm25"><span class="gas-name">Poussières (PM2.5)</span><span class="gas-status" id="st-pm25">-</span></div>
            <div class="gas-card" id="card-co"><span class="gas-name">Échappement (CO)</span><span class="gas-status" id="st-co">-</span></div>
            <div class="gas-card" id="card-no2"><span class="gas-name">Usines (NO2)</span><span class="gas-status" id="st-no2">-</span></div>
            <div class="gas-card" id="card-so2"><span class="gas-name">Soufre (SO2)</span><span class="gas-status" id="st-so2">-</span></div>
        </div>
    </main>

    <div style="position: fixed; bottom: 20px; left: 15px; right: 15px;">
        <button class="btn-pay" style="background:#3182ce;" onclick="scan()">🔍 VÉRIFIER L'AIR MAINTENANT</button>
    </div>

    <script>
        const API_KEY = "d2f39e40a9ae387053d6e2e3c34b673c";

        window.onload = () => {
            const name = localStorage.getItem('sn_name') || "Rollin";
            const cond = localStorage.getItem('sn_cond') || "Aucune";
            document.getElementById('hi-name').innerText = "Salut, " + name;
            document.getElementById('hi-cond').innerText = "Suivi médical : " + cond;
            document.getElementById('in-name').value = name;
            document.getElementById('in-cond').value = cond;
        };

        function toggleProfile() {
            document.getElementById('profile-panel').classList.toggle('open');
            const o = document.getElementById('overlay'); o.style.display = o.style.display === 'block' ? 'none' : 'block';
        }

        function saveProfile() {
            localStorage.setItem('sn_name', document.getElementById('in-name').value);
            localStorage.setItem('sn_cond', document.getElementById('in-cond').value);
            location.reload();
        }

        async function scan() {
            navigator.geolocation.getCurrentPosition(async (p) => {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${p.coords.latitude}&lon=${p.coords.longitude}&appid=${API_KEY}`);
                const d = await res.json();
                const main = d.list[0];
                updateDisplay(main.main.aqi, main.components);
            });
        }

        function updateDisplay(aqi, comp) {
            const circle = document.getElementById('circle');
            const aqiText = document.getElementById('aqi-text');
            const advice = document.getElementById('ai-simple-advice');
            const cond = localStorage.getItem('sn_cond');

            // Mise à jour cercle principal
            const colors = ["#48bb78", "#48bb78", "#ed8936", "#f56565", "#742a2a"];
            const labels = ["Excellent", "Correct", "Moyen", "Mauvais", "Dangereux"];
            
            circle.innerText = aqi;
            circle.style.borderColor = colors[aqi-1];
            circle.style.color = colors[aqi-1];
            aqiText.innerText = "L'air est " + labels[aqi-1];
            aqiText.style.color = colors[aqi-1];

            // Conseil simple
            if(aqi <= 2) advice.innerText = "Tout va bien. Vous pouvez sortir sans crainte.";
            else advice.innerText = "Attention, l'air est pollué. Portez un masque si vous avez " + (cond !== "Aucune" ? "votre " + cond : "une sensibilité") + ".";

            // Mise à jour des petits gaz (Simplifié)
            updateGasCard('pm25', comp.pm2_5, 15, 30);
            updateGasCard('co', comp.co, 500, 1000);
            updateGasCard('no2', comp.no2, 40, 80);
            updateGasCard('so2', comp.so2, 20, 50);
        }

        function updateGasCard(id, val, limitGreen, limitOrange) {
            const el = document.getElementById('st-' + id);
            const card = document.getElementById('card-' + id);
            if(val < limitGreen) { el.innerText = "PROPRE"; card.style.borderBottomColor = "#48bb78"; }
            else if(val < limitOrange) { el.innerText = "MODÉRÉ"; card.style.borderBottomColor = "#ed8936"; }
            else { el.innerText = "ÉLEVÉ"; card.style.borderBottomColor = "#f56565"; }
        }

        setInterval(() => { const d = new Date(); document.getElementById('clock').innerText = d.getHours() + ":" + String(d.getMinutes()).padStart(2, '0'); }, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; 
            --green: #10b981; --orange: #f59e0b; --red: #ef4444; --dark: #1e293b;
            --accent: #3b82f6;
        }
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 120px; transition: 0.3s; }
        
        /* Header Amélioré */
        header { 
            background: linear-gradient(135deg, #0f172a 0%, #334155 100%); 
            color: white; padding: 40px 25px 90px; text-align: center; 
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        .container { padding: 0 15px; margin-top: -70px; }

        /* Jauge Animée */
        .gauge-container { position: relative; width: 150px; height: 150px; margin: 0 auto 20px; }
        .score-circle { 
            width: 100%; height: 100%; border-radius: 50%; background: white; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 8px solid #f1f5f9;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        /* Grille de Polluants */
        .pollutant-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .p-item { background: #f1f5f9; padding: 10px; border-radius: 15px; text-align: center; }
        .p-label { font-size: 10px; font-weight: bold; color: #64748b; display: block; }
        .p-val { font-size: 14px; font-weight: bold; color: var(--dark); }

        .card { background: white; padding: 20px; border-radius: 25px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
        
        /* Dark Mode Toggle */
        .theme-switch { position: absolute; top: 40px; left: 25px; font-size: 20px; cursor: pointer; }
        
        .btn-main { 
            width: 100%; background: var(--dark); color: white; border: none; padding: 20px; 
            border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-main:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header>
        <div class="theme-switch" onclick="toggleDarkMode()">🌓</div>
        <div style="display: flex; justify-content: flex-end; align-items: center;">
            <span onclick="toggleProfile()" style="cursor: pointer; font-size: 26px;">👤</span>
        </div>
        <h2 id="user-title" style="margin: 10px 0 5px; letter-spacing: -1px;">SENTINEL</h2>
        <div id="user-sub" style="font-size: 12px; opacity: 0.7;">Analyseur de gaz haute précision</div>
    </header>

    <main class="container">
        <div class="gauge-container">
            <div class="score-circle" id="gauge">
                <b id="aqi-val" style="font-size: 50px; color: #94a3b8;">--</b>
                <span style="font-size: 11px; color: #94a3b8; font-weight: 800;">AQI</span>
            </div>
        </div>

        <div class="card" style="border-left: 5px solid var(--accent);">
            <div style="font-size: 11px; font-weight: 900; color: var(--accent); margin-bottom: 8px; letter-spacing: 1px;">IA RECOMMENDATION</div>
            <div id="ai-advice" style="font-size: 15px; line-height: 1.4;">Initialisation des capteurs...</div>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 15px 0; font-size: 14px;">ANALYSE DES COMPOSANTS (μg/m³)</h3>
            <div class="pollutant-grid">
                <div class="p-item"><span class="p-label">PM2.5</span><span class="p-val" id="gas-pm25">-</span></div>
                <div class="p-item"><span class="p-label">PM10</span><span class="p-val" id="gas-pm10">-</span></div>
                <div class="p-item"><span class="p-label">CO</span><span class="p-val" id="gas-co">-</span></div>
                <div class="p-item"><span class="p-label">NO2</span><span class="p-val" id="gas-no2">-</span></div>
                <div class="p-item"><span class="p-label">O3</span><span class="p-val" id="gas-o3">-</span></div>
                <div class="p-item"><span class="p-label">SO2</span><span class="p-val" id="gas-so2">-</span></div>
            </div>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 10px 0; font-size: 14px;">PRÉVISIONS 12H</h3>
            <div style="height: 130px;"><canvas id="chart"></canvas></div>
        </div>
    </main>

    <div style="position: fixed; bottom: 25px; left: 20px; right: 20px;">
        <button onclick="runApp()" class="btn-main" id="btn">🚀 SCANNER L'ENVIRONNEMENT</button>
    </div>

    <script>
        const KEY = "d2f39e40a9ae387053d6e2e3c34b673c";
        let chart;

        function toggleDarkMode() {
            document.body.style.filter = document.body.style.filter === 'invert(0.9) hue-rotate(180deg)' ? 'none' : 'invert(0.9) hue-rotate(180deg)';
        }

        async function runApp() {
            const btn = document.getElementById('btn');
            btn.innerText = "CAPTATION DES GAZ...";
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;
                try {
                    const r1 = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${KEY}`);
                    const d1 = await r1.json();
                    const data = d1.list[0];
                    
                    animateValue("aqi-val", 0, data.main.aqi, 1000);
                    updateGasDetails(data.components);
                    
                    const r2 = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution/forecast?lat=${lat}&lon=${lon}&appid=${KEY}`);
                    const d2 = await r2.json();
                    updateUI(data.main.aqi, d2.list.slice(0, 6).map(i => i.main.aqi));
                    
                } catch (e) { alert("Erreur de connexion"); }
                btn.innerText = "🚀 RÉACTUALISER LE SCAN";
            });
        }

        function animateValue(id, start, end, duration) {
            let obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerText = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function updateGasDetails(comp) {
            document.getElementById('gas-pm25').innerText = comp.pm2_5.toFixed(1);
            document.getElementById('gas-pm10').innerText = comp.pm10.toFixed(1);
            document.getElementById('gas-co').innerText = Math.floor(comp.co);
            document.getElementById('gas-no2').innerText = comp.no2.toFixed(1);
            document.getElementById('gas-o3').innerText = comp.o3.toFixed(1);
            document.getElementById('gas-so2').innerText = comp.so2.toFixed(1);
        }

        function updateUI(aqi, forecast) {
            const colors = ["#10b981", "#10b981", "#f59e0b", "#ef4444", "#7f1d1d"];
            const color = colors[aqi-1] || "#10b981";
            document.getElementById('aqi-val').style.color = color;
            document.getElementById('gauge').style.borderColor = color;
            
            let advice = aqi <= 2 ? "Air pur à Madagascar. Excellente condition pour le sport." : "Prudence conseillée pour les profils sensibles.";
            document.getElementById('ai-advice').innerText = advice;

            chart.data.datasets[0].data = forecast;
            chart.data.datasets[0].borderColor = color;
            chart.update();
        }

        // Init Chart (Vide)
        const ctx = document.getElementById('chart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: ['Actuel', '+2h', '+4h', '+6h', '+8h', '+10h'], datasets: [{ data: [0,0,0,0,0,0], borderColor: '#cbd5e1', tension: 0.4, fill: true, backgroundColor: 'rgba(59,130,246,0.05)', pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });
    </script>
</body>
</html>

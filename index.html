<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Pro - Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --bg: #f8fafc; --card: #ffffff; --text: #0f172a; 
            --green: #10b981; --orange: #f59e0b; --red: #ef4444; --dark: #1e293b;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); padding-bottom: 110px; }
        
        header { 
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%); 
            color: white; padding: 40px 25px 80px; text-align: center; 
            border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
        }

        .container { padding: 0 20px; margin-top: -60px; }

        .score-circle { 
            width: 130px; height: 130px; border-radius: 50%; background: white; 
            margin: 0 auto 25px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border: 8px solid #f1f5f9; transition: 0.5s;
        }
        .score-value { font-size: 40px; font-weight: 900; color: #94a3b8; }

        .card { background: white; padding: 20px; border-radius: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        
        .advice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .advice-card { background: white; padding: 15px; border-radius: 20px; text-align: center; border: 1px solid #f1f5f9; }
        
        /* Style du Graphique */
        .chart-container { height: 200px; width: 100%; margin-top: 10px; }

        .action-bar { position: fixed; bottom: 25px; left: 20px; right: 20px; }
        .btn-main { 
            width: 100%; background: var(--dark); color: white; border: none; 
            padding: 20px; border-radius: 22px; font-size: 16px; font-weight: bold; 
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .loader { width: 18px; height: 18px; border: 3px solid #FFF; border-bottom-color: transparent; border-radius: 50%; display: none; animation: rot 1s linear infinite; }
        @keyframes rot { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between;"><span>🛡️</span> <span id="clock">--:--</span> <span>⚙️</span></div>
        <h2 style="margin: 20px 0 5px; font-size: 28px;">SENTINEL</h2>
        <div id="status-text" style="font-size: 12px; opacity: 0.8;">Analyse prédictive IA</div>
    </header>

    <main class="container">
        <div class="score-circle" id="gauge">
            <span class="score-value" id="aqi-val">--</span>
            <span class="score-unit" style="font-size: 10px; color: #94a3b8;">AQI</span>
        </div>

        <div class="advice-grid">
            <div class="advice-card"><i>🏃‍♂️</i><b id="adv-sport">Sport : --</b></div>
            <div class="advice-card"><i>😷</i><b id="adv-mask">Masque : --</b></div>
        </div>

        <div class="card">
            <h3 style="margin: 0 0 15px 0; font-size: 16px;">Évolution 24h (Prévisions)</h3>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </main>

    <div class="action-bar">
        <button onclick="fetchHealthData()" class="btn-main" id="btn-main">
            <span class="loader" id="loader"></span>
            <span id="btn-text">LANCER L'ANALYSE</span>
        </button>
    </div>

    <script>
        const API_KEY = "d2f39e40a9ae387053d6e2e3c34b673c";
        let myChart;

        // Initialisation du graphique vide
        const ctx = document.getElementById('myChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['6h', '9h', '12h', '15h', '18h', '21h'],
                datasets: [{
                    label: 'Niveau AQI',
                    data: [1, 1, 1, 1, 1, 1], // Données par défaut
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        async function fetchHealthData() {
            const btn = document.getElementById('btn-main');
            const loader = document.getElementById('loader');
            btn.disabled = true; loader.style.display = "inline-block";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude: lat, longitude: lon } = pos.coords;

                try {
                    // 1. Pollution actuelle
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                    const data = await res.json();
                    const aqi = data.list[0].main.aqi;

                    // 2. Pollution prévisions (Forecast)
                    const resF = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                    const dataF = await resF.json();
                    
                    // Extraire les 6 prochaines prévisions
                    const forecastData = dataF.list.slice(0, 6).map(item => item.main.aqi);
                    
                    updateUI(aqi, forecastData);
                    document.getElementById('status-text').innerText = `MÀJ RÉUSSIE : ${lat.toFixed(2)}, ${lon.toFixed(2)}`;

                } catch (e) {
                    alert("API en attente d'activation...");
                } finally {
                    btn.disabled = false; loader.style.display = "none";
                }
            });
        }

        function updateUI(aqi, forecast) {
            const valTxt = document.getElementById('aqi-val');
            const colors = ["#10b981", "#10b981", "#f59e0b", "#ef4444", "#7f1d1d"];
            const currentColor = colors[aqi-1] || "#10b981";

            valTxt.innerText = aqi;
            valTxt.style.color = currentColor;
            document.getElementById('gauge').style.borderColor = currentColor;
            document.getElementById('adv-sport').innerText = aqi >= 3 ? "Sport : Limité" : "Sport : Conseillé";
            document.getElementById('adv-mask').innerText = aqi >= 4 ? "Masque : Requis" : "Masque : Non";

            // Mise à jour du graphique avec les vraies prévisions
            myChart.data.datasets[0].data = forecast;
            myChart.data.datasets[0].borderColor = currentColor;
            myChart.update();
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('clock').innerText = n.getHours() + ":" + String(n.getMinutes()).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
